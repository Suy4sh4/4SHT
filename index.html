<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, height=device-height">
    <meta name="theme-color" content="#0a0a14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- App Icons -->
    <link rel="icon" href="app-icon.svg" type="image/svg+xml">
    <link rel="icon" href="app-icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    
    <!-- PWA/Home Screen App Support -->
    <meta name="application-name" content="4SH Tracker">
    <meta name="apple-mobile-web-app-title" content="4SH Tracker">
    <meta name="msapplication-TileColor" content="#0a0a14">
    <meta name="msapplication-TileImage" content="app-icon.svg">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="4SH Daily Streak Tracker - build your habits!">
    
    <title>4SH Streak Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="gradient-blob blob-1"></div>
        <div class="gradient-blob blob-2"></div>
        <div class="gradient-blob blob-3"></div>
    </div>

    <main class="content">
        <div class="motivational-banner">
            <div class="cosmic-wrapper"></div>
            <div class="goal-text-wrapper">
                <span class="goal-text">4SH IS THE GOAL</span>
                <span class="goal-text-glow"></span>
            </div>
        </div>
        <div class="glass-card">
            <div class="streak-info">
                <div class="streak-count">
                    <span id="current-streak">0</span>
                    <span class="days">days</span>
                </div>
                <div class="streak-label">Current Streak</div>
            </div>

            <div class="streak-details">
                <div class="best-streak">
                    <div class="detail-label">Best Streak</div>
                    <div class="detail-value" id="best-streak">0</div>
                </div>
                <div class="detail-divider"></div>
                <div class="start-date">
                    <div class="detail-label">Started</div>
                    <div class="detail-value" id="start-date">-</div>
                </div>
            </div>

            <button id="track-button" class="glow-button">Track Today</button>
        </div>

        <!-- Reset button placed outside the card for better UI/UX -->
        <div class="reset-container">
            <button id="reset-button" class="reset-button">Reset Streak</button>
        </div>
        
        <!-- Reset Confirmation Modal -->
        <div id="reset-modal" class="modal hidden">
            <div class="modal-content">
                <h3>Reset Streak</h3>
                <p>Are you sure you want to reset your streak? This cannot be undone.</p>
                <div class="modal-buttons">
                    <button id="confirm-reset" class="confirm-button">Yes, Reset</button>
                    <button id="cancel-reset" class="cancel-button">Cancel</button>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast hidden">
        <span id="toast-message"></span>
    </div>

    <script src="script.js"></script>
    <script>
        // Register service worker for PWA support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered with scope:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>

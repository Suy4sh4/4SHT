<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0e0728;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0820;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3D2D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5E45;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="streak-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ad7bff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg-gradient)" />
  
  <!-- Background Glow Effects -->
  <circle cx="150" cy="150" r="180" fill="#1900cc" opacity="0.15" filter="url(#glow)" />
  <circle cx="400" cy="350" r="150" fill="#7700aa" opacity="0.12" filter="url(#glow)" />
  
  <!-- 4SH Text -->
  <text x="256" y="220" font-family="Arial, sans-serif" font-size="100" font-weight="bold" text-anchor="middle" fill="url(#text-gradient)" filter="url(#glow)">4SH</text>
  
  <!-- Streak Number -->
  <text x="256" y="330" font-family="Arial, sans-serif" font-size="180" font-weight="bold" text-anchor="middle" fill="url(#streak-gradient)" filter="url(#glow)">4</text>
</svg>